name: Build VST3

on:
  push:
    branches: [ main, master ]
  workflow_dispatch: {}   # lets you click "Run workflow" manually on GitHub too

jobs:
  build-windows:
    runs-on: windows-latest

    steps:
      - name: Check out the repo
        uses: actions/checkout@v4

      # Speeds up re-runs a lot: JUCE only gets downloaded/rebuilt once.
      - name: Cache JUCE / CMake FetchContent
        uses: actions/cache@v4
        with:
          path: build/_deps
          key: ${{ runner.os }}-juce-deps-${{ hashFiles('CMakeLists.txt') }}

      # Sets up MSVC environment variables (cl.exe, link.exe)
      - name: Set up MSVC
        uses: ilammy/msvc-dev-cmd@v1

      - name: Configure
        run: cmake -B build -G Ninja -DCMAKE_BUILD_TYPE=Release

      - name: Build
        run: cmake --build build --parallel

      - name: Upload VST3
        uses: actions/upload-artifact@v4
        with:
          name: FeedbackSuppressor-VST3
          path: build/FeedbackSuppressor_artefacts/**/VST3/**
          if-no-files-found: error

      - name: Upload Standalone app
        uses: actions/upload-artifact@v4
        with:
          name: FeedbackSuppressor-Standalone
          path: build/FeedbackSuppressor_artefacts/**/Standalone/**
          if-no-files-found: error
